<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>IPloacter</title>

<style>
*{
box-sizing:border-box;
margin:0;
padding:0;
}

body{
min-height:100vh;
font-family:Arial,sans-serif;
background:
radial-gradient(circle at top,#18233d 0%,#090b12 45%,#05060a 100%);
color:#fff;
display:flex;
justify-content:center;
align-items:center;
padding:20px;
overflow-x:hidden;
}

.container{
width:100%;
max-width:850px;
}

.header{
text-align:center;
margin-bottom:30px;
}

.logo{
font-size:48px;
font-weight:900;
letter-spacing:5px;
background:linear-gradient(90deg,#7c5cff,#00d9ff);
-webkit-background-clip:text;
color:transparent;
}

.subtitle{
margin-top:8px;
color:#8993aa;
font-size:15px;
}

.search-box{
background:rgba(20,24,38,.75);
border:1px solid rgba(124,92,255,.25);
backdrop-filter:blur(18px);
padding:18px;
border-radius:20px;
display:flex;
gap:12px;
box-shadow:0 15px 50px rgba(0,0,0,.35);
}

input{
flex:1;
background:#0c101b;
border:1px solid #252d42;
outline:none;
border-radius:13px;
padding:15px;
color:white;
font-size:16px;
}

input:focus{
border-color:#7c5cff;
box-shadow:0 0 20px rgba(124,92,255,.2);
}

button{
border:none;
border-radius:13px;
padding:0 25px;
font-size:16px;
font-weight:bold;
color:white;
background:linear-gradient(135deg,#7c5cff,#00bfe8);
cursor:pointer;
transition:.2s;
}

button:hover{
transform:translateY(-2px);
box-shadow:0 8px 25px rgba(0,210,255,.25);
}

button:active{
transform:scale(.97);
}

.status{
text-align:center;
margin:18px 0;
color:#78839b;
min-height:20px;
}

.results{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:14px;
margin-top:20px;
}

.card{
background:rgba(18,22,35,.75);
border:1px solid rgba(255,255,255,.07);
border-radius:17px;
padding:20px;
backdrop-filter:blur(15px);
transition:.2s;
}

.card:hover{
border-color:rgba(124,92,255,.4);
transform:translateY(-2px);
}

.card-title{
font-size:12px;
text-transform:uppercase;
letter-spacing:1.5px;
color:#78839b;
margin-bottom:8px;
}

.card-value{
font-size:18px;
font-weight:bold;
word-break:break-word;
}

.hero{
grid-column:1/-1;
display:flex;
align-items:center;
justify-content:space-between;
padding:25px;
}

.ip{
font-size:28px;
font-weight:900;
}

.flag{
font-size:45px;
}

.map{
margin-top:15px;
height:300px;
border-radius:18px;
overflow:hidden;
background:#0b0e16;
border:1px solid rgba(255,255,255,.08);
}

.map iframe{
width:100%;
height:100%;
border:0;
}

.hidden{
display:none;
}

.error{
color:#ff6b81;
}

.loading{
display:inline-block;
width:18px;
height:18px;
border:3px solid #333b50;
border-top-color:#00d9ff;
border-radius:50%;
animation:spin .7s linear infinite;
vertical-align:middle;
margin-right:7px;
}

@keyframes spin{
to{transform:rotate(360deg)}
}

.footer{
text-align:center;
margin-top:25px;
color:#555e73;
font-size:12px;
}

@media(max-width:650px){

.logo{
font-size:35px;
}

.search-box{
flex-direction:column;
}

button{
height:50px;
}

.results{
grid-template-columns:1fr;
}

.hero{
grid-column:auto;
}

.ip{
font-size:22px;
}

}
</style>
</head>

<body>

<div class="container">

<div class="header">
<div class="logo">IPLOACTER</div>
<div class="subtitle">
Public IP geolocation dashboard
</div>
</div>

<div class="search-box">

<input
id="ipInput"
type="text"
placeholder="Enter public IP address..."
autocomplete="off"
>

<button onclick="lookupIP()">
LOCATE
</button>

</div>

<div id="status" class="status"></div>

<div id="results" class="results hidden">

<div class="card hero">
<div>
<div class="card-title">IP Address</div>
<div id="ip" class="ip">-</div>
</div>

<div id="flag" class="flag">🌐</div>
</div>

<div class="card">
<div class="card-title">Country</div>
<div id="country" class="card-value">-</div>
</div>

<div class="card">
<div class="card-title">Region</div>
<div id="region" class="card-value">-</div>
</div>

<div class="card">
<div class="card-title">City</div>
<div id="city" class="card-value">-</div>
</div>

<div class="card">
<div class="card-title">Postal Code</div>
<div id="postal" class="card-value">-</div>
</div>

<div class="card">
<div class="card-title">ISP</div>
<div id="isp" class="card-value">-</div>
</div>

<div class="card">
<div class="card-title">Timezone</div>
<div id="timezone" class="card-value">-</div>
</div>

<div class="card">
<div class="card-title">Latitude</div>
<div id="lat" class="card-value">-</div>
</div>

<div class="card">
<div class="card-title">Longitude</div>
<div id="lon" class="card-value">-</div>
</div>

<div class="card" style="grid-column:1/-1">

<div class="card-title">Location Map</div>

<div class="map">
<iframe
id="map"
loading="lazy">
</iframe>
</div>

</div>

</div>

<div class="footer">
IPloacter • Public IP information only
</div>

</div>

<script>

async function lookupIP(){

const input =
document.getElementById("ipInput");

const ip =
input.value.trim();

const status =
document.getElementById("status");

const results =
document.getElementById("results");

if(!ip){

status.innerHTML =
'<span class="error">Enter an IP address first.</span>';

results.classList.add("hidden");

return;
}

status.innerHTML =
'<span class="loading"></span>Locating IP...';

results.classList.add("hidden");

try{

const response =
await fetch(
"https://ipwho.is/" +
encodeURIComponent(ip)
);

const data =
await response.json();

if(!data.success){

throw new Error(
data.message || "Invalid IP"
);

}

document.getElementById("ip").textContent =
data.ip || "-";

document.getElementById("country").textContent =
data.country || "-";

document.getElementById("region").textContent =
data.region || "-";

document.getElementById("city").textContent =
data.city || "-";

document.getElementById("postal").textContent =
data.postal || "-";

document.getElementById("isp").textContent =
data.connection?.isp || "-";

document.getElementById("timezone").textContent =
data.timezone?.id || "-";

document.getElementById("lat").textContent =
data.latitude ?? "-";

document.getElementById("lon").textContent =
data.longitude ?? "-";

document.getElementById("flag").textContent =
data.flag?.emoji || "🌐";

const lat = data.latitude;
const lon = data.longitude;

if(lat && lon){

document.getElementById("map").src =
`https://www.openstreetmap.org/export/embed.html?bbox=${lon-0.08}%2C${lat-0.05}%2C${lon+0.08}%2C${lat+0.05}&layer=mapnik&marker=${lat}%2C${lon}`;

}

results.classList.remove("hidden");

status.innerHTML =
"Location found.";

}catch(error){

status.innerHTML =
'<span class="error">Could not locate that IP.</span>';

console.error(error);

}

}

document
.getElementById("ipInput")
.addEventListener("keydown",function(event){

if(event.key === "Enter"){
lookupIP();
}

});

</script>

</body>
</html>
